services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      EMAIL_HASH_KEY: ${EMAIL_HASH_KEY:?Set EMAIL_HASH_KEY in .env}
      DATABASE_URL: postgresql://practice:local-development@db:5432/practice
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: local-development
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres:
